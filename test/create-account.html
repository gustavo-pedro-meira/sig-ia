<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Sistema SIG-IA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
        }
        input.error, select.error {
            border-color: #dc3545;
            background-color: #f8d7da;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: -10px;
            margin-bottom: 10px;
            display: none;
        }
        button {
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #218838;
        }
        .response {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            .container {
                padding: 15px;
            }
            input, select {
                font-size: 14px;
                padding: 8px;
            }
            button {
                padding: 10px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Criar Conta</h1>
        <form id="createAccountForm">
            <label for="fullName">Nome Completo:</label>
            <input type="text" id="fullName" name="fullName" required>
            <div id="fullNameError" class="error-message"></div>

            <label for="username">Nome de Usuário:</label>
            <input type="text" id="username" name="username" required minlength="6">
            <div id="usernameError" class="error-message"></div>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <div id="emailError" class="error-message"></div>

            <label for="password">Senha:</label>
            <input type="password" id="password" name="password" required minlength="8">
            <div id="passwordError" class="error-message"></div>

            <label for="gender">Gênero:</label>
            <select id="gender" name="gender" required>
                <option value="">Selecione</option>
                <option value="Male">Masculino</option>
                <option value="Female">Feminino</option>
                <option value="Other">Outro</option>
            </select>
            <div id="genderError" class="error-message"></div>

            <label for="phone">Telefone:</label>
            <input type="tel" id="phone" name="phone" required>
            <div id="phoneError" class="error-message"></div>

            <label for="dateOfBirth">Data de Nascimento:</label>
            <input type="date" id="dateOfBirth" name="dateOfBirth" required>
            <div id="dateOfBirthError" class="error-message"></div>

            <label for="position">Cargo:</label>
            <select id="position" name="position" required>
                <option value="">Selecione</option>
                <option value="Cabinet">Gabinete</option>
                <option value="Secretary">Secretário</option>
                <option value="Technician1">Técnico 1</option>
                <option value="Technician2">Técnico 2</option>
                <option value="Technician3">Técnico 3</option>
            </select>
            <div id="positionError" class="error-message"></div>

            <label for="expirationDate">Data de Expiração:</label>
            <input type="date" id="expirationDate" name="expirationDate" required>
            <div id="expirationDateError" class="error-message"></div>

            <label for="departmentId">Departamento:</label>
            <select id="departmentId" name="departmentId" required>
                <option value="">Carregando departamentos...</option>
            </select>
            <div id="departmentIdError" class="error-message"></div>

            <button type="submit">Criar Conta</button>
        </form>
        <div id="response" class="response"></div>
    </div>

    <script>
        // Função para carregar departamentos
        async function loadDepartments() {
            try {
                const response = await fetch('http://localhost:3000/departments');
                const departments = await response.json();
                
                const departmentSelect = document.getElementById('departmentId');
                departmentSelect.innerHTML = '<option value="">Selecione um departamento</option>';
                
                departments.forEach(department => {
                    const option = document.createElement('option');
                    option.value = department.id;
                    option.textContent = `${department.name} - ${department.sector}`;
                    departmentSelect.appendChild(option);
                });
            } catch (error) {
                console.error('Erro ao carregar departamentos:', error);
                const departmentSelect = document.getElementById('departmentId');
                departmentSelect.innerHTML = '<option value="">Erro ao carregar departamentos</option>';
            }
        }

        // Carregar departamentos quando a página carrega
        document.addEventListener('DOMContentLoaded', loadDepartments);
        // Função para limpar todos os erros
        function clearErrors() {
            const inputs = document.querySelectorAll('input, select');
            inputs.forEach(input => input.classList.remove('error'));
            
            const errorMessages = document.querySelectorAll('.error-message');
            errorMessages.forEach(msg => {
                msg.textContent = '';
                msg.style.display = 'none';
            });
        }

        // Função para mostrar erro em um campo específico
        function showFieldError(fieldName, message) {
            const input = document.getElementById(fieldName);
            const errorDiv = document.getElementById(fieldName + 'Error');
            
            if (input) {
                input.classList.add('error');
            }
            if (errorDiv) {
                errorDiv.textContent = message;
                errorDiv.style.display = 'block';
            }
        }

        // Mapeamento de campos do backend para IDs do frontend
        const fieldMapping = {
            fullName: 'fullName',
            username: 'username',
            email: 'email',
            password: 'password',
            gender: 'gender',
            phone: 'phone',
            dateOfBirth: 'dateOfBirth',
            position: 'position',
            expirationDate: 'expirationDate',
            departmentId: 'departmentId'
        };

        document.getElementById('createAccountForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            // Limpar erros anteriores
            clearErrors();

            const formData = new FormData(event.target);
            const data = {
                fullName: formData.get('fullName'),
                username: formData.get('username'),
                email: formData.get('email'),
                password: formData.get('password'),
                gender: formData.get('gender'),
                phone: formData.get('phone'),
                dateOfBirth: formData.get('dateOfBirth'),
                position: formData.get('position'),
                expirationDate: formData.get('expirationDate'),
                departmentId: formData.get('departmentId')
            };

            try {
                const response = await fetch('http://localhost:3000/employees', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                const responseDiv = document.getElementById('response');

                if (response.ok) {
                    responseDiv.className = 'response success';
                    responseDiv.textContent = 'Conta criada com sucesso!';
                    responseDiv.style.display = 'block';
                } else {
                    responseDiv.className = 'response error';
                    
                    // Verificar se há erros de validação específicos
                    if (result.errors && Array.isArray(result.errors)) {
                        // Erros de validação do Zod
                        responseDiv.textContent = 'Por favor, corrija os erros abaixo:';
                        
                        result.errors.forEach(error => {
                            const fieldName = error.path && error.path[0]; // Primeiro elemento do path
                            if (fieldName && fieldMapping[fieldName]) {
                                showFieldError(fieldMapping[fieldName], error.message);
                            }
                        });
                    } else if (result.message && Array.isArray(result.message)) {
                        // Erros de validação do class-validator (fallback)
                        responseDiv.textContent = 'Por favor, corrija os erros abaixo:';
                        
                        result.message.forEach(error => {
                            const fieldName = Object.keys(fieldMapping).find(key => 
                                error.toLowerCase().includes(key.toLowerCase()) ||
                                error.toLowerCase().includes(fieldMapping[key].toLowerCase())
                            );
                            
                            if (fieldName && fieldMapping[fieldName]) {
                                showFieldError(fieldMapping[fieldName], error);
                            }
                        });
                    } else if (result.message) {
                        // Erro genérico
                        responseDiv.textContent = 'Erro: ' + result.message;
                    } else {
                        responseDiv.textContent = 'Erro desconhecido ao criar conta';
                    }
                    
                    responseDiv.style.display = 'block';
                }
            } catch (error) {
                const responseDiv = document.getElementById('response');
                responseDiv.className = 'response error';
                responseDiv.textContent = 'Erro de rede: ' + error.message;
                responseDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
